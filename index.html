<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farhan Premium Electronics Mall</title>
    <!-- Official Font Awesome Icon Library Included -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #0f172a; color: #fff; }
        header { background: #1e293b; color: #38bdf8; padding: 20px; text-align: center; font-size: 24px; font-weight: bold; border-bottom: 3px solid #38bdf8; text-transform: uppercase; }
        .container { max-width: 1200px; margin: 20px auto; padding: 0 15px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .card { background: #1e293b; padding: 15px; border-radius: 10px; text-align: center; border: 1px solid #334155; }
        .price { color: #38bdf8; font-size: 22px; font-weight: bold; margin: 10px 0; }
        button { background: linear-gradient(135deg, #38bdf8, #0ea5e9); color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; text-transform: uppercase; }
        .cart-box { background: #1e293b; padding: 25px; border-radius: 10px; margin-top: 40px; border: 1px solid #334155; }
        input, textarea { width: 100%; padding: 12px; margin-bottom: 12px; background: #0f172a; color: white; border: 1px solid #334155; border-radius: 6px; box-sizing: border-box; }
        .captcha-box { background: #1e1b4b; padding: 15px; border-radius: 6px; border: 1px solid #312e81; font-weight: bold; color: #818cf8; margin-bottom: 12px; font-size: 18px; }
        .submit-btn { background: linear-gradient(135deg, #22c55e, #16a34a); color: white; font-size: 18px; padding: 15px; width: 100%; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; text-transform: uppercase; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .fa-whatsapp { font-size: 24px; color: #fff; }
    </style>
</head>
<body>
    <header>✨ Farhan Premium Electronics Mall ✨</header>
    <div class="container">
        <div class="grid" id="product-grid"></div>
        <div class="cart-box">
            <h2>🛒 Shopping Cart & Order Summary</h2>
            <p id="cart-status" style="color:#cbd5e1; font-size: 18px; font-weight: bold;">Basket khali hai. Koi product select karein.</p>
            <div class="price">Total Billing Amount: Rs. <span id="total-bill">0</span></div>
            <h3>📋 Premium Verified Checkout Form</h3>
            <form id="order-form">
                <input type="text" id="cust-name" required placeholder="Aap ka Full Naam...">
                <input type="tel" id="cust-phone" required placeholder="WhatsApp Number (e.g. 03121545628)...">
                <textarea id="cust-address" rows="3" required placeholder="Complete Delivery Address..."></textarea>
                <div class="captcha-box"><span id="captcha-q"></span></div>
                <input type="number" id="captcha-a" required placeholder="Type the correct math answer here...">
                <button type="submit" class="submit-btn"><i class="fa fa-whatsapp"></i> Confirm Order on WhatsApp 🚀</button>
            </form>
        </div>
    </div>
    <script>
        const gadgets = ["iPhone 15 Pro Max", "Samsung Galaxy S24 Ultra", "MacBook Pro M3", "Sony WH-1000XM5", "PlayStation 5 Slim", "Apple Watch Series 9", "iPad Air M2", "Nintendo Switch OLED", "DJI Mini 4 Pro", "AirPods Pro 2"];
        let gridHtml = "";
        for(let i=1; i<=100; i++) {
            let name = gadgets[(i-1)%gadgets.length] + " (Edition #" + i + ")";
            let price = 25000 + (i * 1250);
            gridHtml += `<div class="card"><h3>${name}</h3><div class="price">Rs. ${price.toLocaleString()}</div><button onclick="addToCart('${name}', ${price})">Add to Cart</button></div>`;
        }
        document.getElementById('product-grid').innerHTML = gridHtml;

        let selectedItem = null;
        let n1 = Math.floor(Math.random() * 8) + 2;
        let n2 = Math.floor(Math.random() * 7) + 2;
        let ans = n1 + n2;
        document.getElementById('captcha-q').innerText = "🤖 Anti-Bot Check: " + n1 + " + " + n2 + " = ?";

        function addToCart(name, price) {
            selectedItem = { name: name, price: price };
            document.getElementById('cart-status').innerText = "Selected Product: " + name;
            document.getElementById('total-bill').innerText = price.toLocaleString();
            alert("🛒 " + name + " Basket mein successfully add ho gaya!");
        }

        document.getElementById('order-form').addEventListener('submit', function(e) {
            e.preventDefault();
            if(!selectedItem) {
                alert("Pehle Product Basket mein Add karein!");
                return;
            }
            if(parseInt(document.getElementById('captcha-a').value) !== ans) {
                alert("❌ Wrong Math Answer!");
                return;
            }
            
            let name = document.getElementById('cust-name').value;
            let phone = document.getElementById('cust-phone').value;
            let addr = document.getElementById('cust-address').value;
            
            let text = '*🔥 NEW PREMIUM GADGET ORDER!*%0A%0A' +
                       '*Customer Name:* ' + encodeURIComponent(name) + '%0A' +
                       '*WhatsApp Number:* ' + encodeURIComponent(phone) + '%0A' +
                       '*Delivery Address:* ' + encodeURIComponent(addr) + '%0A' +
                       '*Selected Product:* ' + encodeURIComponent(selectedItem.name) + '%0A' +
                       '*Total Invoice Bill:* Rs. ' + selectedItem.price.toLocaleString();
                       
            window.location.href = 'https://wa.me' + text;
        });
    </script>
</body>
</html>
