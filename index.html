<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farhan Premium Electronics Mall</title>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #0b0f19; color: #fff; scroll-behavior: smooth; }
        header { background: #151f32; color: #38bdf8; padding: 25px; text-align: center; font-size: 26px; font-weight: bold; border-bottom: 3px solid #38bdf8; text-transform: uppercase; letter-spacing: 1px; }
        .container { max-width: 1200px; margin: 20px auto; padding: 0 15px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .card { background: #151f32; padding: 20px; border-radius: 12px; text-align: center; border: 1px solid #24344d; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .price { color: #38bdf8; font-size: 22px; font-weight: bold; margin: 10px 0; }
        .card button { background: linear-gradient(135deg, #38bdf8, #0ea5e9); color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; text-transform: uppercase; }
        .cart-box { background: #151f32; padding: 30px; border-radius: 15px; margin-top: 40px; border: 1px solid #24344d; box-shadow: 0 8px 25px rgba(0,0,0,0.5); }
        .cart-box h2 { color: #38bdf8; margin-top: 0; text-transform: uppercase; font-size: 20px; }
        #cart-status { background: #0b0f19; padding: 12px; border-radius: 6px; font-size: 16px; margin-bottom: 15px; border-left: 4px solid #38bdf8; }
        input, textarea { width: 100%; padding: 12px; margin-bottom: 12px; background: #0b0f19; color: white; border: 1px solid #24344d; border-radius: 6px; box-sizing: border-box; font-size: 15px; }
        .captcha-box { background: #1e1b4b; padding: 15px; border-radius: 6px; border: 1px solid #312e81; font-weight: bold; color: #818cf8; margin-bottom: 15px; font-size: 18px; }
        .submit-btn { background: linear-gradient(135deg, #22c55e, #16a34a); color: white; font-size: 18px; padding: 15px; width: 100%; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; text-transform: uppercase; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 4px 15px rgba(34,197,94,0.3); }
        .fa-whatsapp { font-size: 24px; }
    </style>
</head>
<body>
    <header>✨ Farhan Premium Electronics Mall ✨</header>
    <div class="container">
        <div class="grid" id="product-grid"></div>
        <div class="cart-box" id="billing-section">
            <h2>🛒 Selected Item & Order Summary</h2>
            <div id="cart-status">Basket khali hai. Koi product select karein.</div>
            <div class="price">Total Amount: Rs. <span id="total-bill">0</span></div>
            <h2>📋 Delivery Checkout Form</h2>
            <form id="order-form">
                <input type="text" id="cust-name" required placeholder="Aap ka Full Naam...">
                <input type="tel" id="cust-phone" required placeholder="WhatsApp Number...">
                <textarea id="cust-address" rows="3" required placeholder="Complete Delivery Address..."></textarea>
                <div class="captcha-box"><span id="captcha-q"></span></div>
                <input type="number" id="captcha-a" required placeholder="Type the correct math answer here...">
                <button type="submit" class="submit-btn"><i class="fa fa-whatsapp"></i> Confirm Order on WhatsApp 🚀</button>
            </form>
        </div>
    </div>
    <script>
        const gadgets = ["iPhone 15 Pro Max", "Samsung Galaxy S24 Ultra", "MacBook Pro M3", "Sony WH-1000XM5", "PlayStation 5 Slim", "Apple Watch Series 9", "iPad Air M2", "Nintendo Switch OLED", "DJI Mini 4 Pro", "AirPods Pro 2"];
        let gridHtml = "";
        for(let i=1; i<=100; i++) {
            let name = gadgets[(i-1)%gadgets.length] + " (Edition #" + i + ")";
            let price = 25000 + (i * 1250);
            gridHtml += `<div class="card"><h3>${name}</h3><div class="price">Rs. ${price.toLocaleString()}</div><button onclick="addToCart('${name}', ${price})">Add to Cart</button></div>`;
        }
        document.getElementById('product-grid').innerHTML = gridHtml;

        let selectedItem = null;
        let n1 = Math.floor(Math.random() * 8) + 2;
        let n2 = Math.floor(Math.random() * 7) + 2;
        let ans = n1 + n2;
        document.getElementById('captcha-q').innerText = "🤖 Security Check: " + n1 + " + " + n2 + " = ?";

        function addToCart(name, price) {
            selectedItem = { name: name, price: price };
            document.getElementById('cart-status').innerHTML = "<strong>Selected:</strong> " + name;
            document.getElementById('total-bill').innerText = price.toLocaleString();
            document.getElementById('billing-section').scrollIntoView({ behavior: 'smooth' });
            alert("🛒 " + name + " Basket mein add ho gaya! Billing form niche open ho gaya hai.");
        }

        document.getElementById('order-form').addEventListener('submit', function(e) {
            e.preventDefault();
            if(!selectedItem) return alert("Pehle Product Basket mein Add karein!");
            if(parseInt(document.getElementById('captcha-a').value) !== ans) return alert("❌ Wrong Math Answer!");
            
            let name = document.getElementById('cust-name').value;
            let phone = document.getElementById('cust-phone').value;
            let addr = document.getElementById('cust-address').value;
            
            let text = '*🔥 NEW PREMIUM GADGET ORDER!*%0A%0A' +
                       '*Customer Name:* ' + encodeURIComponent(name) + '%0A' +
                       '*WhatsApp Number:* ' + encodeURIComponent(phone) + '%0A' +
                       '*Delivery Address:* ' + encodeURIComponent(addr) + '%0A' +
                       '*Selected Product:* ' + encodeURIComponent(selectedItem.name) + '%0A' +
                       '*Total Invoice Bill:* Rs. ' + selectedItem.price.toLocaleString();
                       
            window.location.href = 'https://whatsapp.com' + text;
        });
    </script>
</body>
</html>
